# Build Installer. GitHub Actions replacement for BHoMBot's 00:45 UTC alpha build.
#
# Three-input model (see proposal.md Section 6):
#   1. Installer branch  : "Use workflow from Branch" (GHA's --ref). The
#                          installer repo is checked out at this ref and
#                          the resulting release tag lands on this branch's
#                          HEAD. Hard rule: beta dispatches must use the repo's
#                          default branch.
#   2. Release type      : workflow_dispatch input. alpha | alpha-beta | beta.
#   3. Dependency branch : workflow_dispatch input. The branch tried on
#                          each dep clone; falls back to that dep's own
#                          default branch if absent. Convention is 'develop'
#                          for alpha-beta/beta; non-conventional values
#                          surface a warning but are not blocked.
#
# Triggers and the release flavours they produce:
#
#   schedule            Nightly alpha. Fires 00:45 UTC on the default branch.
#                       release_type=alpha, dependency_branch=develop,
#                       prerelease=true.
#
#   workflow_dispatch   Manual run, fully parameterised. See input docs below.

name: Build Installer

# Run title is the release tier, verbatim from the release_type vocabulary used by
# the tag scheme and the wixproj Configuration mapping. The Actions UI already shows
# the trigger and timing, so a "(nightly)" marker would be redundant, and the friendly
# forms ("Alpha", "Release Candidate", "Release") are composed by the publish job for
# the Releases page. Scheduled runs have no inputs, so the fallback matches the input
# default rather than encoding a trigger.
run-name: ${{ inputs.release_type || 'alpha' }}

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: |
          alpha      — pre-release. Tag: vM.N.0-alpha.YYMMDD[.counter]. May be
                       dispatched from any installer-repo branch.
          alpha-beta — release candidate (use during feature-freeze QA). Tag:
                       vM.N.0-alpha.beta.counter. May be dispatched from any
                       installer-repo branch. dependency_branch convention is
                       develop (warning if not).
          beta       — shipped release. Tag: vM.N.0-beta derived from
                       BHoM_Installer.wixproj's MajorVersion/MinorVersion.
                       Marked Latest on the Releases page; prerelease=false.
                       MUST be dispatched with "Use workflow from Branch" set
                       to the repo's default branch (resolved at runtime from
                       github.event.repository.default_branch; the workflow
                       rejects any other ref). dependency_branch convention is
                       develop (warning if not).
        type: choice
        options:
          - alpha
          - alpha-beta
          - beta
        default: alpha
      dependency_branch:
        description: |
          Branch to try first on every dep repo clone. Falls back to each
          dep's own default branch when the requested branch is not present.
          Leave empty to skip the try-first step and clone every dep at its
          own default branch (develop for every current beta-tier repo).
          Useful for testing a feature branch across deps that share the
          branch name (alpha workflow).
          For alpha-beta and beta dispatches: convention is empty or 'develop';
          any other value surfaces a warning in the run log and release body
          but is not rejected.
        type: string
        required: false
        default: ''

  schedule:
    - cron: '45 0 * * *'   # 00:45 UTC nightly, matching BHoMBot

permissions:
  contents: read

concurrency:
  group: build-installer-${{ github.event_name }}
  cancel-in-progress: false

env:
  # Pinned WiX-v3-built baseline MSI for the upgrade-test job.
  #
  # A published release asset, deliberately, and not either of the two
  # alternatives:
  #   - a retained Actions artefact has 30-day retention, so the leg would begin
  #     failing a month later with no code change;
  #   - a build on a "frozen" branch is not frozen. Its dependency resolution
  #     keeps moving, so the baseline would quietly stop being a v3 comparison,
  #     and it would add a full dependency clone to every run.
  #
  # MOVE THIS TAG DELIBERATELY AND NEVER TO "THE LATEST RELEASE". The whole
  # value of the pin is that the package predates the WiX toolchain migration.
  # v9.2.0-alpha.beta.8 was published 2026-07-02: ProductVersion 9.2.1.8,
  # UpgradeCode {64C4DABF-7D02-4412-B422-953E47C780C8}, RemoveExistingProducts
  # at sequence 1401, all identical in kind to what the current build produces.
  UPGRADE_BASELINE_TAG: v9.2.0-alpha.beta.8

  # The product's UpgradeCode, fixed at Product.wxs:4. Used to enumerate
  # installed products through the Windows Installer API rather than probing a
  # registry hive; see the upgrade-test header for why that distinction matters.
  BHOM_UPGRADE_CODE: '{64C4DABF-7D02-4412-B422-953E47C780C8}'

jobs:
  # Normalise the trigger event into the parameters every downstream job
  # needs. Single source of truth for: which release type to build, what
  # patch version to pass to MSBuild, what branch each dep should be
  # cloned from, and how the GitHub Release should be flagged.
  resolve:
    name: Resolve release parameters
    runs-on: ubuntu-latest
    outputs:
      release_type:      ${{ steps.r.outputs.release_type }}
      dependency_branch: ${{ steps.r.outputs.dependency_branch }}
      prerelease:        ${{ steps.r.outputs.prerelease }}
      make_latest:       ${{ steps.r.outputs.make_latest }}
      release_tag:       ${{ steps.r.outputs.release_tag }}
      msi_patch_version: ${{ steps.r.outputs.msi_patch_version }}
      should_publish:    ${{ steps.r.outputs.should_publish }}
      wix_major:         ${{ steps.r.outputs.wix_major }}
      wix_minor:         ${{ steps.r.outputs.wix_minor }}
      installer_ref:     ${{ steps.r.outputs.installer_ref }}
    steps:
      - name: Checkout (sparse) for the wixproj and resolve script
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            BHoM_Installer/BHoM_Installer.wixproj
            scripts/resolve-release-tag.sh
          sparse-checkout-cone-mode: false

      - id: r
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # GITHUB_REF is set by GHA automatically; the resolve script reads
          # it as the workflow-ref input (rule 6: beta must equal the repo's
          # default branch, which we pass in via INPUT_DEFAULT_BRANCH).
          INPUT_RELEASE_TYPE:      ${{ inputs.release_type }}
          INPUT_DEPENDENCY_BRANCH: ${{ inputs.dependency_branch }}
          INPUT_DEFAULT_BRANCH:    ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          bash scripts/resolve-release-tag.sh >> "$GITHUB_OUTPUT"
          # Echo github.ref_name as an explicit output for downstream jobs that
          # want to surface "Installer branch" in release-body provenance.
          echo "installer_ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "::notice::Resolved parameters:"
          grep -E '^(release_type|dependency_branch|prerelease|make_latest|release_tag|msi_patch_version|should_publish|wix_major|wix_minor|installer_ref)=' "$GITHUB_OUTPUT"

  build:
    name: Build ${{ needs.resolve.outputs.release_type }} installer
    needs: resolve
    runs-on: windows-2025-vs2026
    timeout-minutes: 30    # ~14 min observed wall-clock post-decoupling; 2x headroom
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout installer repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1

      # No git-auth configuration needed: all repos referenced by the BHoM_Installer
      # manifests are public BHoM org repos. When this workflow is extended to
      # BuroHappold_Installer (which bundles private BHE repos), add the
      # mint-dep-token step here.

      - name: Restore build-tools cache (WiX + net40 ref assemblies)
        # Caches the two pieces of external tooling the build job sets up on
        # every run: WiX Toolset v3.11.2 (choco-installed) and the .NET
        # Framework 4.0 reference-assembly targeting pack (nuget + manual
        # copy). Both are version-pinned and the steps that produce them
        # take 1-2 minutes combined on a cold runner — including the
        # occasional multi-minute choco-mirror stall observed on 2026-06-17.
        # Cache hit skips both installs and goes straight to env-var setup.
        # Cache key bumps when WiX version, net40-refs version, or runner
        # image changes; manual invalidation by bumping the trailing -vN.
        # BHoM dependency repos are NOT cached here — they are cloned and
        # built fresh per dispatch by Build-Installer.ps1.
        id: tools-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.0
            C:\Program Files (x86)\WiX Toolset v3.11
          key: build-tools-${{ runner.os }}-wix3.11.2-net40refs1.0.3-v1

      # The "Provide .NET Framework 4.0 reference assemblies" step that used to
      # sit here is gone. InstallerCA was the only net40 consumer in the
      # solution (BHoM_Installer.sln holds exactly three projects, and it is the
      # only .csproj), and it now targets net472 with DTF supplied by the
      # WixToolset.Dtf.CustomAction package, so nothing asks MSBuild for a v4.0
      # targeting pack and MSB3644 cannot fire.
      #
      # The cache step above still lists the v4.0 reference-assembly directory in
      # its `path` and still names net40refs in its key. Both are now vestigial:
      # on a miss nothing creates that directory and the save simply skips it.
      # Left in place deliberately rather than tidied in the same change, because
      # the whole cache step is under review alongside the WiX pin and should be
      # removed as one decision, not trimmed twice.
      #
      # Note for the downstream installer that shares InstallerCA: only the net40
      # half of its equivalent step is retired by this change. Its net46 half must
      # stay, because it serves that repository's own projects rather than
      # InstallerCA. Do not delete it by symmetry with this one.
      - name: Pin WiX Toolset v3.11.2
        if: steps.tools-cache.outputs.cache-hit != 'true'
        # GHA windows-2025-vs2026 ships WiX v3.14. The v3.14 SfxCA.dll stub
        # (bundled by MakeSfxCA into InstallerCA.CA.dll) appears to be the
        # source of "SFXCA: Failed to create temp directory. Error code 5"
        # on hardened Windows 11 per-user installs. v3.11.2 has been the
        # long-stable build BHoMBot uses; pinning to that for parity until
        # we migrate to WiX v5 in Phase 2.
        run: |
          Write-Host "=== WiX directories on runner (before) ==="
          Get-ChildItem 'C:\Program Files (x86)' -Filter 'WiX*' -Directory | Select-Object FullName | Format-Table -AutoSize | Out-String | Write-Host

          # Remove pre-installed WiX v3.14 so v3.11.2 installs cleanly to its own path.
          # The choco package's underlying .exe installer no-ops if any v3.x is present,
          # which is why our previous attempt "succeeded" without actually downgrading.
          choco uninstall wixtoolset -y --no-progress --skip-autouninstaller-failure-check || Write-Host "(no existing choco wixtoolset to uninstall)"
          Get-ChildItem 'C:\Program Files (x86)' -Filter 'WiX Toolset v3.*' -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "Removing $($_.FullName)"
              Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
          }

          choco install wixtoolset --version=3.11.2 --force -y --no-progress

          Write-Host ""
          Write-Host "=== WiX directories on runner (after) ==="
          Get-ChildItem 'C:\Program Files (x86)' -Filter 'WiX*' -Directory | Select-Object FullName | Format-Table -AutoSize | Out-String | Write-Host

      - name: Configure WiX env vars
        # GITHUB_ENV and GITHUB_PATH exports do not survive across step
        # boundaries on a cache HIT (the install step that previously set
        # them is skipped). Resolve the WiX root from disk and export
        # WIX + PATH unconditionally so downstream MSBuild and candle/light
        # invocations resolve the pinned v3.11.2 binaries regardless of
        # whether the cache hit or missed.
        run: |
          $wixRoot = Get-ChildItem 'C:\Program Files (x86)' -Filter 'WiX Toolset v3.11*' -Directory -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $wixRoot) { throw "WiX 3.11 install missing under C:\Program Files (x86) (cache restore failed or install step did not run)" }
          $wixBin = Join-Path $wixRoot 'bin'
          if (-not (Test-Path $wixBin)) { throw "WiX 3.11 install missing bin\: $wixBin" }

          "WIX=$wixRoot\"   | Out-File -FilePath $env:GITHUB_ENV  -Append
          "$wixBin"         | Out-File -FilePath $env:GITHUB_PATH -Append
          Write-Host "Pinned WiX root: $wixRoot"
          & "$wixBin\candle.exe" -? | Select-Object -First 1 | Write-Host

      - name: Build installer
        id: build
        env:
          RELEASE_TYPE:      ${{ needs.resolve.outputs.release_type }}
          MSI_PATCH_VERSION: ${{ needs.resolve.outputs.msi_patch_version }}
          DEPENDENCY_BRANCH: ${{ needs.resolve.outputs.dependency_branch }}
        run: |
          # Hashtable splat (not array) so PowerShell binds by parameter name.
          # Array splatting would otherwise treat '-ReleaseType' as a value.
          $splat = @{
              ReleaseType       = $env:RELEASE_TYPE
              DependencyBranch  = $env:DEPENDENCY_BRANCH
          }
          # Only forward MSI_PATCH_VERSION when resolve emitted one. Alpha
          # leaves it blank so Build-Installer.ps1 falls through to its yyMMdd
          # default. alpha-beta and beta flavours set it explicitly so the MSI
          # filename matches the release tag.
          if ($env:MSI_PATCH_VERSION) { $splat['PatchVersion'] = $env:MSI_PATCH_VERSION }

          & "$env:GITHUB_WORKSPACE\scripts\Build-Installer.ps1" @splat

      - name: Generate dep manifest (for release-note diffing)
        # Walk the cloned dep repos that sit alongside the installer checkout
        # and record each one's (org/repo, current tip SHA). The publish job
        # downloads the previous release's copy of this file and diffs it
        # against this one to render "what changed since last build" notes.
        #
        # The per-dep `branch` field records the branch each dep was actually
        # RESOLVED to, read back from the clone. The requested branch is kept at
        # the manifest's top level as `dependency_branch`.
        env:
          RELEASE_TYPE:      ${{ needs.resolve.outputs.release_type }}
          DEPENDENCY_BRANCH: ${{ needs.resolve.outputs.dependency_branch }}
          INSTALLER_REF:     ${{ needs.resolve.outputs.installer_ref }}
        run: |
          # Build-Installer.ps1 clones every dep into its $CodeLocation, which is
          # the parent of this repo's checkout. Derive both the walk root and the
          # installer's own folder name from GITHUB_WORKSPACE rather than hardcoding
          # the hosted-runner path: a self-hosted runner, a runner-image drive
          # change, or a repo rename would otherwise leave the walk pointing at a
          # nonexistent directory and, because Get-ChildItem is non-fatal here,
          # silently emit `deps: {}` on an otherwise-green build.
          $codeLocation  = Split-Path -Parent $env:GITHUB_WORKSPACE
          $installerName = Split-Path -Leaf   $env:GITHUB_WORKSPACE

          $depsObject = [ordered]@{}
          Get-ChildItem $codeLocation -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -ne $installerName -and (Test-Path (Join-Path $_.FullName '.git')) } |
              Sort-Object Name |
              ForEach-Object {
                  $remoteUrl = (git -C $_.FullName config --get remote.origin.url 2>$null)
                  if ($remoteUrl -match 'github\.com[/:]([^/]+)/([^/.]+?)(?:\.git)?$') {
                      $orgRepo = "$($Matches[1])/$($Matches[2])"
                      $sha = (git -C $_.FullName rev-parse HEAD 2>$null).Trim()
                      # Record the RESOLVED branch, not the requested one. Clone-Repo
                      # skips --branch entirely when DependencyBranch is empty, so the
                      # requested value is blank on every default-path build and the
                      # branch each dep actually landed on is only knowable from the
                      # clone. Tag refs would leave a detached HEAD; the SHA above
                      # already identifies those, so label them rather than lie.
                      $resolvedBranch = (git -C $_.FullName rev-parse --abbrev-ref HEAD 2>$null)
                      if ($resolvedBranch) { $resolvedBranch = $resolvedBranch.Trim() }
                      if (-not $resolvedBranch -or $resolvedBranch -eq 'HEAD') { $resolvedBranch = '(detached)' }
                      if ($sha) {
                          $depsObject[$orgRepo] = [ordered]@{ branch = $resolvedBranch; sha = $sha }
                      }
                  }
              }

          $manifest = [ordered]@{
              version           = 1
              built_at          = (Get-Date).ToUniversalTime().ToString('o')
              release_type      = $env:RELEASE_TYPE
              installer_branch  = $env:INSTALLER_REF
              dependency_branch = $env:DEPENDENCY_BRANCH
              deps              = $depsObject
          }

          $outPath = Join-Path $env:GITHUB_WORKSPACE 'Build\dep-manifest.json'
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -Path $outPath -Encoding UTF8
          Write-Host "::notice::Wrote dep-manifest.json with $($depsObject.Count) deps"

      - name: Assert .msi size is sane
        # Catches catastrophic packaging regressions: a tiny .msi means WiX shipped
        # nearly nothing; a huge one means something is being bundled that shouldn't
        # be. Current builds land ~46 MB; we use a 30-100 MB envelope to allow
        # normal growth but trip on order-of-magnitude breakage.
        # Get-Item with -ErrorAction Stop fails-loud if no .msi is present, which
        # the downstream upload step would also catch via if-no-files-found: error;
        # surfacing it here keeps attribution clean (size step vs upload step).
        run: |
          $msi = Get-Item '${{ github.workspace }}/Build/*.msi' -ErrorAction Stop | Select-Object -First 1
          $mb = [math]::Round($msi.Length / 1MB, 2)
          Write-Host "::notice::.msi size: $mb MB ($($msi.Name))"
          if ($mb -lt 30 -or $mb -gt 100) {
              throw ".msi size $mb MB is outside the 30-100 MB sanity range, indicating a possible packaging regression"
          }

      # actions/upload-artifact@v4 preserves paths relative to the common
      # ancestor of all inputs. Staging IncludedDLLs.txt into Build/ (rather
      # than uploading directly from Settings/) keeps the common ancestor at
      # Build/ so the artefact stays flat — install-test uses
      # `Get-Item msi\*.msi` at the artefact root and would fail 1619 on a
      # nested layout.
      - name: Stage IncludedDLLs.txt into Build/ for artefact upload
        if: success()
        shell: pwsh
        run: |
          $src = Join-Path $env:GITHUB_WORKSPACE 'Settings/IncludedDLLs.txt'
          $dst = Join-Path $env:GITHUB_WORKSPACE 'Build/IncludedDLLs.txt'
          if (-not (Test-Path $src)) {
              throw "Expected $src to exist after Build-Installer.ps1 ran, but it does not."
          }
          Copy-Item $src $dst -Force
          Write-Host "Staged IncludedDLLs.txt at $dst for artefact upload."

      - name: Upload installer artefact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: installer-${{ needs.resolve.outputs.release_type }}-${{ github.run_id }}
          # Settings/IncludedDLLs.txt is written by Build-Installer.ps1
          # alongside the .msi build; staged into Build/ by the preceding step
          # so the artefact common ancestor remains Build/. Attaching it as
          # a standalone Release asset gives downstream workflows (notably
          # ci-versioning.yml) a baseline of the last-shipped canonical DLL
          # set without needing to extract the .msi.
          path: |
            ${{ github.workspace }}/Build/*.msi
            ${{ github.workspace }}/Build/dep-manifest.json
            ${{ github.workspace }}/Build/IncludedDLLs.txt
          if-no-files-found: error
          retention-days: 30

  # Smoke test the produced .msi: install on a vanilla Windows runner, assert
  # log markers + post-install state, then uninstall and re-assert.
  #
  # Catches the class of regressions that won't surface from a successful build
  # alone (e.g. the WiX 3.14 SfxCA temp-directory failure, broken WiX components,
  # missing-file references, custom-action runtime exceptions). Runs as a matrix
  # across two Windows versions so OS-specific CA / SFXCA divergence shows up.
  # Explicit runner labels rather than windows-latest for reproducibility.
  install-test:
    name: Install + uninstall (${{ matrix.os }})
    needs: [resolve, build]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download .msi artefact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: installer-${{ needs.resolve.outputs.release_type }}-${{ github.run_id }}
          path: msi

      - name: Install
        run: |
          $msi = (Get-Item msi\*.msi | Select-Object -First 1).FullName
          Write-Host "Installing $msi"
          $p = Start-Process msiexec -ArgumentList '/i', $msi, '/L*V', 'install.log', '/passive' -Wait -PassThru
          Write-Host "msiexec /i exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "msiexec /i failed with exit $($p.ExitCode)" }

      # The install assertions below are split into one step per check so that
      # failure attribution is immediate from the GHA Actions UI without log
      # reading. Each step runs independently; a failed step does NOT skip
      # subsequent steps (the matrix leg still bails because the failed step
      # fails the job, but every assertion that ran is visible).

      - name: Convert install log to UTF-8 (MSI logs are UTF-16LE)
        run: |
          Get-Content install.log -Encoding Unicode | Set-Content install.utf8.log -Encoding UTF8

      - name: Assert no fatal markers in install log
        # Bare 'returned actual error code 1603' lines are deliberately not
        # flagged: WiX marks some custom actions with Continue="yes"
        # (WixRemoveFoldersEx, Action_RegisterAddIn, Action_UnRegisterAddInOld)
        # and the log records the 1603 followed by 'but will be translated to
        # success due to continue marking', which is by-design non-fatal. The
        # genuinely-fatal case still produces 'Return value 3' and
        # 'MainEngineThread is returning 1603', which the patterns below catch.
        run: |
          $patterns = @(
              'Return value 3',
              'MainEngineThread is returning 1603',
              'SFXCA: Failed'
          )
          $hits = Select-String -Path install.utf8.log -Pattern $patterns
          if ($hits) {
              $hits | ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
              throw "Fatal markers found in install log"
          }

      - name: Assert positive install-success marker
        run: |
          if (-not (Select-String -Path install.utf8.log -Pattern 'Installation success or error status: 0' -Quiet)) {
              throw "Install log missing 'Installation success or error status: 0'. Install did not complete cleanly."
          }

      - name: Assert expected files exist after install
        run: |
          $expected = @(
              'C:\ProgramData\BHoM\Assemblies\BHoM.dll',
              'C:\ProgramData\BHoM\Assemblies\BHoM_Engine.dll',
              'C:\ProgramData\BHoM\GrasshopperPlugin\BH.UI.Grasshopper.gha',
              'C:\ProgramData\BHoM\Settings\IncludedDLLs.txt'
          )
          $missing = $expected | Where-Object { -not (Test-Path $_) }
          if ($missing) {
              $missing | ForEach-Object { Write-Host "::error::Missing post-install file: $_" }
              throw "Expected files missing after install"
          }

      - name: Assert installed DLL count meets manifest
        # The WiX install must place at least as many DLLs in Assemblies\ as
        # the build manifest declares. Fewer-than-manifest implies WiX dropped
        # components silently during packaging.
        run: |
          $manifestEntries = (Get-Content 'C:\ProgramData\BHoM\Settings\IncludedDLLs.txt' | Where-Object { $_.Trim() }).Count
          $onDiskDlls      = (Get-ChildItem 'C:\ProgramData\BHoM\Assemblies' -Filter '*.dll' -ErrorAction SilentlyContinue).Count
          Write-Host "::notice::Assemblies on disk: $onDiskDlls    IncludedDLLs.txt manifest: $manifestEntries"
          if ($onDiskDlls -lt $manifestEntries) {
              throw "Only $onDiskDlls DLLs installed but manifest declares $manifestEntries. Components are missing."
          }

      - name: Assert BHoM.dll loads as a .NET assembly
        # GetTypes() is deliberately not called because it requires every
        # referenced dep to be resolvable in the load context, which is
        # fragile for a per-file Assembly.LoadFrom. AssemblyName resolution
        # is enough to catch a corrupted-DLL build without introducing false
        # failures.
        run: |
          try {
              $asm  = [System.Reflection.Assembly]::LoadFrom('C:\ProgramData\BHoM\Assemblies\BHoM.dll')
              $name = $asm.GetName()
              Write-Host "::notice::BHoM.dll loaded: $($name.Name) v$($name.Version)"
          } catch {
              throw "BHoM.dll failed to load as a .NET assembly: $($_.Exception.Message)"
          }

      - name: Assert product is registered in Uninstall registry
        # Also captures the ProductCode into GITHUB_ENV for the subsequent
        # Uninstall step to use.
        run: |
          $reg = Get-ItemProperty 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
                 Where-Object { $_.DisplayName -like 'Buildings and Habitats*' } |
                 Select-Object -First 1
          if (-not $reg) { throw "Product not registered in Uninstall registry" }
          Write-Host "::notice::Installed $($reg.DisplayName) $($reg.DisplayVersion)"
          "PRODUCT_CODE=$($reg.PSChildName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Uninstall
        run: |
          Write-Host "Uninstalling $env:PRODUCT_CODE"
          $p = Start-Process msiexec -ArgumentList '/x', $env:PRODUCT_CODE, '/L*V', 'uninstall.log', '/passive' -Wait -PassThru
          Write-Host "msiexec /x exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "msiexec /x failed with exit $($p.ExitCode)" }

      - name: Validate uninstall
        run: |
          Get-Content uninstall.log -Encoding Unicode | Set-Content uninstall.utf8.log -Encoding UTF8
          $still = Get-ItemProperty 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
                   Where-Object { $_.DisplayName -like 'Buildings and Habitats*' }
          if ($still) { throw "Product still registered in Uninstall registry after /x" }
          Write-Host "::notice::Uninstall left registry clean"

      - name: Upload install/uninstall logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: install-test-logs-${{ matrix.os }}-${{ github.run_id }}
          path: |
            install.log
            install.utf8.log
            uninstall.log
            uninstall.utf8.log
          if-no-files-found: warn
          retention-days: 14

  # Administrative install (msiexec /a). Exercises the AdminExecuteSequence,
  # which schedules Action_CloseAppsPrompt UNCONDITIONALLY (Product.wxs:30) --
  # that is the one immediate managed custom action, and the only one whose
  # SfxCA stub has to extract and host the CLR before any managed code runs.
  #
  # READ THIS BEFORE TRUSTING A GREEN HERE. This leg would NOT have caught the
  # defect it was written in response to. On 2026-09-02 a pinned WiX 3.11.2 build
  # and an unpinned 3.14 build both failed `msiexec /a` with
  # "SFXCA: Failed to create temp directory. Error code 5" on a corporate
  # Windows 11 Enterprise machine, while a post-DTF-migration build succeeded.
  # A GitHub-hosted runner is Windows Server, runs as a local administrator and
  # carries no hardening baseline, so the temp-directory create does not get
  # ACCESS_DENIED there. This leg is a POSITIVE assertion that SfxCA extracts and
  # the managed CA enters -- which nothing else asserts anywhere -- and not
  # coverage of the reported user-facing symptom. Do not read it as the latter.
  admin-install-test:
    name: Administrative install (msiexec /a)
    needs: [resolve, build]
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download .msi artefact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: installer-${{ needs.resolve.outputs.release_type }}-${{ github.run_id }}
          path: msi

      - name: Administrative install
        # OFFICEREGKEYS="" is load-bearing, not tidiness. On a SUCCESSFUL /a the
        # deferred CaRegisterAddIn also runs (its condition is NOT Installed) and
        # writes OPEN values into HKCU\Software\Microsoft\Office\<ver>\Excel\Options
        # pointing at ASSEMBLIESDIR -- which for an administrative install is the
        # throwaway image directory. That would leave a broken Excel add-in
        # registration behind. CaRegisterAddIn skips its entire body when the
        # OFFICEREGKEYS list is empty, so passing it empty neutralises this.
        #
        # /qn is safe here despite Action_CloseAppsPrompt being a WinForms dialog:
        # the dialog only appears when EXCEL is already running, which it is not
        # on a runner.
        run: |
          $msi = (Get-Item msi\*.msi | Select-Object -First 1).FullName
          $root = Join-Path $env:RUNNER_TEMP 'adminimage'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Write-Host "Administrative install of $msi into $root"
          $p = Start-Process msiexec -ArgumentList @(
                 '/a', "`"$msi`"", '/qn', '/L*V', 'admin-install.log',
                 "TARGETDIR=`"$root`"", 'OFFICEREGKEYS=""'
               ) -Wait -PassThru
          Write-Host "::notice::msiexec /a exit code: $($p.ExitCode)"

      - name: Convert admin-install log to UTF-8 (MSI logs are UTF-16LE)
        if: always()
        run: Get-Content admin-install.log | Set-Content admin-install.utf8.log -Encoding utf8

      - name: Assert SfxCA extracted and the managed custom action entered
        # ASSERTED ON LOG MARKERS, NOT ON THE EXIT CODE, deliberately. A
        # UI-showing immediate custom action can return 1603 for want of an
        # interactive desktop, which is a completely different failure from the
        # SfxCA one and would otherwise be indistinguishable. Equally, a green
        # exit code alone does not prove the managed CA ran -- so the positive
        # marker is required, not just the absence of the negative one.
        run: |
          $log = Get-Content admin-install.utf8.log -Raw

          if ($log -match 'SFXCA: Failed to create temp directory') {
              throw "SfxCA could not extract the managed custom action: 'SFXCA: Failed to create temp directory' present in the admin-install log. This is the failure mode that a WiX v3.11.2 pin did NOT prevent; see the retained logs referenced in the build job comments."
          }

          if ($log -notmatch 'SFXCA: Extracting custom action to temporary directory') {
              throw "No SfxCA extraction line in the log. The managed custom action was never unpacked, so this run proves nothing about it."
          }

          if ($log -notmatch 'Begin PromptToCloseApplications') {
              throw "SfxCA extracted but the managed custom action never entered: 'Begin PromptToCloseApplications' absent. Managed code did not run."
          }

          if ($log -notmatch 'End PromptToCloseApplications') {
              throw "The managed custom action entered but did not complete: 'Begin PromptToCloseApplications' present, 'End' absent."
          }

          Write-Host "::notice::SfxCA extracted, CLR bound, and the managed custom action ran to completion."

      - name: Assert the admin image was populated
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'adminimage'
          $n = @(Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue).Count
          Write-Host "::notice::admin image file count: $n"
          if ($n -lt 100) { throw "Administrative install produced only $n files under $root, expected a full payload." }

      - name: Assert no Excel add-in registration was left behind
        # Guards the OFFICEREGKEYS="" mitigation above rather than trusting it.
        if: always()
        run: |
          $leaked = @()
          Get-ChildItem 'HKCU:\Software\Microsoft\Office' -ErrorAction SilentlyContinue | ForEach-Object {
              $k = "HKCU:\Software\Microsoft\Office\$($_.PSChildName)\Excel\Options"
              if (Test-Path $k) {
                  (Get-ItemProperty $k).PSObject.Properties |
                      Where-Object { $_.Name -like 'OPEN*' -and $_.Value -match 'adminimage|RUNNER_TEMP|Temp' } |
                      ForEach-Object { $leaked += "$k :: $($_.Name) = $($_.Value)" }
              }
          }
          if ($leaked.Count -gt 0) {
              throw "CaRegisterAddIn wrote OPEN values pointing at the throwaway admin image, so OFFICEREGKEYS='' did not suppress it: $($leaked -join ' | ')"
          }
          Write-Host "::notice::no Excel add-in registration left behind."

      - name: Upload admin-install log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: admin-install-log-${{ github.run_id }}
          path: |
            admin-install.log
            admin-install.utf8.log
          if-no-files-found: warn
          retention-days: 14

  # Upgrade over an existing install. Installs a pinned WiX-v3-built MSI, installs
  # this run's MSI over it, and asserts the result against a clean install of the
  # same MSI taken in the same job.
  #
  # WHY THIS EXISTS. Nothing else tests upgrade. install-test and
  # admin-install-test both only ever touch a clean runner, so
  # Components.wxs:31-63's RemoveFile entries and the util:RemoveFolderEx block
  # in the Core component group are code that never executes under test. The MSI
  # is InstallScope="perUser" with <MajorUpgrade AllowDowngrades="yes" /> and its
  # Upgrade row is VersionMin 0 with no maximum, so every prior version including
  # an equal one is detected: upgrade is the normal user experience rather than an
  # edge case.
  #
  # WHAT THIS LEG DELIBERATELY DOES NOT ASSERT: component GUID equality. Measured
  # 2026-09-03 across two builds of the same commit, 795 of 822 component GUIDs
  # already differ, because every HeatDirectory in InstallerCore.wixproj runs with
  # GenerateGuidsNow="true" and assemblies.xslt's KeyPath="no" transform leaves 274
  # components with a directory keypath, which rules out deterministic Guid="*".
  # It is harmless because RemoveExistingProducts is sequenced at 1401, so the old
  # product is removed in full before the new one installs and no component
  # matching happens across the upgrade. A GUID-equality assertion would fail today
  # against an unchanged toolchain.
  #
  # TWO LIMITS ON A GREEN HERE. Read both before trusting one.
  #
  #   1. The baseline predates the InstallerCA migration, so this leg installs the
  #      OLD net40 custom action and its old SfxCA stub in its baseline phase. That
  #      is representative of what a user actually has installed, which is the
  #      point, but it means the baseline phase is not exercising current CA code.
  #      A baseline-phase failure is a fact about the baseline, not about this run's
  #      MSI, which is why that phase asserts separately and says so.
  #
  #   2. This leg validates upgrade in whatever install context the RUNNER resolves
  #      to, which is not necessarily the user's. The package is authored perUser
  #      (ALLUSERS=2, MSIINSTALLPERUSER=1, summary WordCount 10) but msiexec runs
  #      elevated here, and the nightly log shows ALLUSERS being deleted and
  #      MSIINSTALLPERUSER ignored while the per-machine ARP entry is nonetheless
  #      present. Which context wins on the runner is not settled. This leg is
  #      written to not care: it enumerates products by UpgradeCode through the
  #      Windows Installer API instead of reading a registry hive. Do not "simplify"
  #      that back to a hive probe.
  #
  # NOT WATCHED BY notify-on-failure. That job's needs are [build, install-test]
  # and are left alone here, because PR 76 removes the job outright by decision.
  # So while it still exists, a nightly failure in THIS leg opens no issue. The
  # reporting decision belongs to whatever replaces that job, not to this change.
  upgrade-test:
    name: Upgrade over a v3-built MSI
    needs: [resolve, build]
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download this run's .msi artefact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: installer-${{ needs.resolve.outputs.release_type }}-${{ github.run_id }}
          path: msi

      - name: Download the pinned v3-built baseline MSI
        # HARD FAILURE, NOT A SKIP. If the baseline cannot be fetched this leg
        # proves nothing, and a leg that quietly proves nothing while reporting
        # success is a shape this workflow has already produced twice: a nightly
        # reporting job whose needs meant it could not fire on the failure it
        # existed to catch, and a toolchain pin whose stated justification turned
        # out never to have been verified. Because publish gates on this job, a
        # 404 here blocks the release, which is the correct outcome: it means the
        # upgrade path went untested.
        #
        # The tag is named explicitly rather than resolved. `gh release download`
        # with no tag picks the latest NON-prerelease, and every installer release
        # is published as a pre-release, so an unnamed download finds nothing.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:UPGRADE_BASELINE_TAG
          Write-Host "Baseline tag: $tag"
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern '*.msi' --dir baseline
          if ($LASTEXITCODE -ne 0) {
              throw "Could not download the pinned baseline MSI from release '$tag' in $env:GITHUB_REPOSITORY. This leg cannot run without it and must not report success without it. Check the tag in the workflow-level UPGRADE_BASELINE_TAG env and that its .msi asset still exists."
          }

          $found = @(Get-ChildItem baseline -Filter *.msi -File)
          if ($found.Count -ne 1) {
              throw "Expected exactly one .msi asset on release '$tag', found $($found.Count): $($found.Name -join ', ')"
          }
          if ($found[0].Length -lt 1MB) {
              throw "Baseline MSI $($found[0].Name) is only $($found[0].Length) bytes, which cannot be a real payload."
          }
          Write-Host "::notice::Baseline MSI: $($found[0].Name) ($([math]::Round($found[0].Length / 1MB, 2)) MB)"
          "BASELINE_MSI=$($found[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Read the baseline's ProductCode
        # Captured so the upgrade assertion can prove THIS baseline product was the
        # one removed, rather than merely that some upgrade happened. Read from the
        # package rather than hardcoded, so re-pointing UPGRADE_BASELINE_TAG needs
        # no second edit.
        run: |
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db   = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @($env:BASELINE_MSI, 0))
          $sql  = 'SELECT `Value` FROM `Property` WHERE `Property` = ''ProductCode'''
          $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @($sql))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null) | Out-Null
          $rec  = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
          if ($null -eq $rec) { throw "Baseline MSI has no ProductCode property, so it is not a valid package." }
          $code = [string]$rec.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec, @(1))
          if (-not $code) { throw "Baseline ProductCode read back empty." }
          Write-Host "::notice::Baseline ProductCode: $code"
          "BASELINE_PRODUCT_CODE=$code" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Write the shared tree-snapshot helper
        # Single-sourced on purpose. The whole leg turns on comparing two trees, so
        # both snapshots must be taken by identical code; two inline copies that
        # drift by a -Force or a sort order would produce a difference that looks
        # like a packaging defect.
        run: |
          $helper = Join-Path $env:RUNNER_TEMP 'bhom-upgrade-helpers.ps1'
          @'
          $BHoMRoot = 'C:\ProgramData\BHoM'

          # ARRAY SEMANTICS ARE ENFORCED AT THE CALL SITES, WITH @(), AND NOWHERE
          # ELSE. Both of these accessors emit normally, so a single result unrolls
          # to a bare string on return and @() re-wraps it. Every one of the twelve
          # call sites does that, and there are no exceptions to check for.
          #
          # Do not "harden" these functions with Write-Output -NoEnumerate. It does
          # not compose with @(): -NoEnumerate emits the array as ONE object, which
          # @() then wraps again, so the caller gets a one-element array containing
          # the array. Both mistakes have been made here in sequence. The first
          # (@() missing) produced "msiexec /f {" and exit 1619; the second
          # (-NoEnumerate added as well) produced a reference tree of "1 files".
          # One mechanism, at the call site.
          function Get-BHoMTree {
              if (-not (Test-Path $BHoMRoot)) { return @() }
              Get-ChildItem $BHoMRoot -Recurse -File -Force -ErrorAction SilentlyContinue |
                  ForEach-Object { $_.FullName.Substring($BHoMRoot.Length).TrimStart('\') } |
                  Sort-Object
          }

          function Get-BHoMProducts {
              # Enumerate installed products sharing the product's UpgradeCode, via
              # the Windows Installer API. Context-agnostic by design: see the job
              # header on why a registry-hive probe is the wrong instrument here.
              $installer = New-Object -ComObject WindowsInstaller.Installer
              try {
                  $list = $installer.GetType().InvokeMember('RelatedProducts', 'GetProperty', $null, $installer, @($env:BHOM_UPGRADE_CODE))
              } catch {
                  return @()
              }
              if ($null -eq $list) { return @() }
              $n = $list.GetType().InvokeMember('Count', 'GetProperty', $null, $list, $null)
              $out = @()
              for ($i = 0; $i -lt $n; $i++) {
                  $out += [string]$list.GetType().InvokeMember('Item', 'GetProperty', $null, $list, @($i))
              }
              $out
          }

          function Get-MsiFileVersions {
              # Map of long file name -> array of DISTINCT versions declared for that
              # name anywhere in the MSI. An array rather than a single value because
              # a name can legitimately appear in more than one directory: the payload
              # ships BHoM_Engine.dll and BHoM_Adapter.dll in both ASSEMBLIESDIR and
              # GRASSHOPPERPLUGINDIR. Keeping only the first would silently pick one
              # if they ever diverged, so the caller is given the choice and can
              # refuse an ambiguous probe.
              #
              # Returns a hashtable, which does not unroll on return, so it needs
              # none of the @() handling the two list accessors above do.
              param([string]$MsiPath)
              $map = @{}
              $installer = New-Object -ComObject WindowsInstaller.Installer
              $db   = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @($MsiPath, 0))
              $sql  = 'SELECT `FileName`,`Version` FROM `File`'
              $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @($sql))
              $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null) | Out-Null
              while ($true) {
                  $rec = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
                  if ($null -eq $rec) { break }
                  $name = [string]$rec.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec, @(1))
                  $ver  = [string]$rec.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec, @(2))
                  # FileName is "shortname|longname"; the long name is what lands on disk.
                  $long = if ($name -match '\|') { $name.Split('|')[-1] } else { $name }
                  if ($long) {
                      if ($map.ContainsKey($long)) {
                          if ($map[$long] -notcontains $ver) { $map[$long] += $ver }
                      } else {
                          $map[$long] = @($ver)
                      }
                  }
              }
              $map
          }

          function Get-OnDiskFileVersion {
              # Normalised through FileVersionInfo's parts rather than its
              # FileVersion string, which is free-form and does not always match
              # the dotted quad the MSI File table records.
              param([string]$Path)
              $vi = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($Path)
              "$($vi.FileMajorPart).$($vi.FileMinorPart).$($vi.FileBuildPart).$($vi.FilePrivatePart)"
          }

          function Assert-ProductCode {
              # Guards against handing msiexec something that is not a product code.
              # Without this, a malformed value reaches msiexec and comes back as a
              # generic 1619 with no log, which reads as a product defect rather
              # than as a scripting bug. That misattribution already happened once.
              param([string]$Value, [string]$Context)
              if ($Value -notmatch '^\{[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}\}$') {
                  throw "$Context expected a product code and got '$Value'. This is a fault in this workflow, not in the installer."
              }
          }

          function Invoke-Msi {
              # $args is an automatic variable in PowerShell, hence $msiArgs.
              param([string[]]$Arguments, [string]$LogName)
              $msiArgs = $Arguments + @('/L*V', $LogName, '/passive')
              $p = Start-Process msiexec -ArgumentList $msiArgs -Wait -PassThru

              # Converted here rather than in a separate step so that every
              # transaction's log is readable even when its caller throws. Guarded
              # because a transaction that never started writes no log, and losing
              # the exit code to a conversion error would destroy the attribution
              # this leg is built around.
              if (Test-Path $LogName) {
                  Get-Content $LogName -Encoding Unicode | Set-Content "$LogName.utf8.log" -Encoding UTF8
              } else {
                  Write-Host "::warning::msiexec produced no log at $LogName, so exit code $($p.ExitCode) is all the evidence there is."
              }
              $p.ExitCode
          }
          '@ | Set-Content -Path $helper -Encoding UTF8
          Write-Host "Helper written to $helper"

      # ---- Phase A: clean install of THIS run's MSI, to produce the reference tree.

      - name: 'Phase A: clean-install this run''s MSI'
        run: |
          . (Join-Path $env:RUNNER_TEMP 'bhom-upgrade-helpers.ps1')
          $msi = (Get-Item msi\*.msi | Select-Object -First 1).FullName
          "NEW_MSI=$msi" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Clean-installing $msi"
          $rc = Invoke-Msi -Arguments @('/i', $msi) -LogName 'a-clean-install.log'
          Write-Host "::notice::Phase A /i exit code: $rc"
          if ($rc -ne 0) { throw "Phase A clean install failed with exit $rc. This is a clean-install failure, which install-test also covers; fix that before reading anything into the upgrade legs." }

      - name: 'Phase A: capture the reference tree'
        run: |
          . (Join-Path $env:RUNNER_TEMP 'bhom-upgrade-helpers.ps1')
          $tree = @(Get-BHoMTree)
          if ($tree.Count -lt 100) { throw "Reference tree has only $($tree.Count) files under C:\ProgramData\BHoM, which cannot be a full payload. Nothing downstream would be meaningful." }
          # Written into the working directory, not RUNNER_TEMP. upload-artifact@v4
          # preserves paths relative to the common ancestor of all its inputs, so a
          # snapshot under RUNNER_TEMP alongside workspace-relative logs would
          # silently push everything into a nested layout.
          $tree | Set-Content -Path 'tree-a.txt' -Encoding UTF8
          Write-Host "::notice::Reference tree: $($tree.Count) files"

      - name: 'Phase A: uninstall and assert the machine is clean again'
        # Establishes the precondition for phase B rather than testing anything new.
        # If uninstall leaves residue, the tree comparison later would be measuring
        # that residue instead of the upgrade.
        run: |
          . (Join-Path $env:RUNNER_TEMP 'bhom-upgrade-helpers.ps1')
          foreach ($code in @(Get-BHoMProducts)) {
              Write-Host "Removing $code"
              $rc = Invoke-Msi -Arguments @('/x', $code) -LogName 'a-uninstall.log'
              if ($rc -ne 0) { throw "Phase A uninstall of $code failed with exit $rc" }
          }
          $left = @(Get-BHoMProducts)
          if ($left.Count -ne 0) { throw "Phase A left $($left.Count) product(s) registered: $($left -join ', ')" }
          $residue = @(Get-BHoMTree)
          if ($residue.Count -ne 0) {
              $residue | ForEach-Object { Write-Host "::error::Residual file after phase A uninstall: $_" }
              throw "Phase A uninstall left $($residue.Count) file(s) under C:\ProgramData\BHoM. The upgrade comparison cannot start from a dirty machine."
          }
          Write-Host "::notice::Phase A uninstall left no products and no files."

      # ---- Phase B: install the pinned v3-built baseline.

      - name: 'Phase B: install the v3-built baseline'
        # Asserted separately from the upgrade so that attribution is unambiguous.
        # A failure here is a fact about the pinned baseline package (which carries
        # the pre-migration net40 custom action), not about this run's MSI.
        run: |
          . (Join-Path $env:RUNNER_TEMP 'bhom-upgrade-helpers.ps1')
          Write-Host "Installing baseline $env:BASELINE_MSI"
          $rc = Invoke-Msi -Arguments @('/i', $env:BASELINE_MSI) -LogName 'b-baseline-install.log'
          Write-Host "::notice::Phase B /i exit code: $rc"
          if ($rc -ne 0) { throw "The pinned BASELINE MSI ($env:UPGRADE_BASELINE_TAG) failed to install with exit $rc. This is a failure of the baseline, not of this run's build. Read b-baseline-install.log.utf8.log before touching anything else." }

          $products = @(Get-BHoMProducts)
          if ($products -notcontains $env:BASELINE_PRODUCT_CODE) {
              throw "Baseline installed but product $env:BASELINE_PRODUCT_CODE is not registered under UpgradeCode $env:BHOM_UPGRADE_CODE. Found: $($products -join ', ')"
          }
          Write-Host "::notice::Baseline registered as $env:BASELINE_PRODUCT_CODE"

      # ---- Phase C: the upgrade itself.

      - name: 'Phase C: install this run''s MSI over the baseline'
        # ASSERTION 1 of 9: the upgrade transaction itself succeeds.
        run: |
          . (Join-Path $env:RUNNER_TEMP 'bhom-upgrade-helpers.ps1')
          Write-Host "Upgrading with $env:NEW_MSI"
          $rc = Invoke-Msi -Arguments @('/i', $env:NEW_MSI) -LogName 'c-upgrade.log'
          Write-Host "::notice::Phase C /i exit code: $rc"
          if ($rc -ne 0) { throw "Upgrade install over the baseline failed with exit $rc" }

      - name: 'Assert the upgrade path was actually taken'
        # ASSERTION 2 of 9, and the load-bearing one. Without it a SIDE-BY-SIDE
        # install passes every other assertion in this job and the leg proves
        # nothing at all. Two markers, because either alone is weak:
        #   - WIX_UPGRADE_DETECTED is the Upgrade table's ActionProperty, so its
        #     presence proves FindRelatedProducts matched the baseline, and its
        #     value proves it matched THIS baseline;
        #   - RemoveExistingProducts having run proves the match was acted on.
        run: |
          $log = Get-Content 'c-upgrade.log.utf8.log' -Raw

          if ($log -notmatch 'WIX_UPGRADE_DETECTED') {
              throw "WIX_UPGRADE_DETECTED never appears in the upgrade log, so FindRelatedProducts did not match the installed baseline. This was a side-by-side install, not an upgrade, and nothing else in this job means anything."
          }

          $expected = [regex]::Escape($env:BASELINE_PRODUCT_CODE)
          if ($log -notmatch "WIX_UPGRADE_DETECTED[^\r\n]*$expected") {
              Write-Host "::error::Expected WIX_UPGRADE_DETECTED to name $env:BASELINE_PRODUCT_CODE"
              $log -split "`r?`n" | Select-String -Pattern 'WIX_UPGRADE_DETECTED' | ForEach-Object { Write-Host "::error::$($_.Line.Trim())" }
              throw "WIX_UPGRADE_DETECTED is set but does not name the baseline ProductCode $env:BASELINE_PRODUCT_CODE. Something other than the package we installed in phase B was detected."
          }

          if ($log -notmatch 'RemoveExistingProducts') {
              throw "RemoveExistingProducts does not appear in the upgrade log. The old product was detected but never removed."
          }

          Write-Host "::notice::Upgrade detected $env:BASELINE_PRODUCT_CODE and ran RemoveExistingProducts."

      - name: 'Assert exactly one product remains'
        # ASSERTION 3 of 9. Enumerated through the Windows Installer API, not a
        # registry hive: see limit 2 in the job header.
        run: |
          . (Join-Path $env:RUNNER_TEMP 'bhom-upgrade-helpers.ps1')
          $products = @(Get-BHoMProducts)
          Write-Host "::notice::Products under UpgradeCode $($env:BHOM_UPGRADE_CODE): $($products.Count)"
          if ($products.Count -ne 1) {
              $products | ForEach-Object { Write-Host "::error::Registered product: $_" }
              throw "Expected exactly 1 product after the upgrade, found $($products.Count). More than one means the upgrade installed alongside the baseline instead of replacing it."
          }
          # Assert-ProductCode before the comparison, not after. Without the @()
          # above, $products[0] was the character '{' and this comparison passed
          # for the wrong reason on the first validation run.
          Assert-ProductCode -Value $products[0] -Context 'remaining-product assertion'
          Write-Host "::notice::Remaining product: $($products[0])"
          if ($products[0] -eq $env:BASELINE_PRODUCT_CODE) {
              throw "The single remaining product is still the baseline ($env:BASELINE_PRODUCT_CODE). The upgrade did not take."
          }

      - name: 'Assert the upgraded tree matches a clean install exactly'
        # ASSERTION 4 of 9. This is the assertion that covers Components.wxs:31-63's
        # RemoveFile entries and the util:RemoveFolderEx block, and it is the one
        # that would catch harvest-layout movement across the WiX migration.
        # Extra path  = an orphan the upgrade failed to clean.
        # Missing path = a component the upgrade dropped.
        # Compared by relative path set only. Sizes and hashes are deliberately not
        # compared here: the baseline is months older than this run's payload, so
        # content differences between the two are expected and legitimate.
        #
        # THE COROLLARY IS THAT THIS ASSERTION IS BLIND TO CONTENT. A stale file the
        # upgrade failed to overwrite has the same path as its replacement, so it
        # passes here. Assertion 5 is what covers that, and neither assertion
        # substitutes for the other.
        run: |
          . (Join-Path $env:RUNNER_TEMP 'bhom-upgrade-helpers.ps1')
          $reference = @(Get-Content 'tree-a.txt')
          $upgraded  = @(Get-BHoMTree)
          $upgraded | Set-Content -Path 'tree-c.txt' -Encoding UTF8

          # Guarded before Compare-Object, which needs non-empty inputs to say
          # anything useful. An empty upgraded tree is a total-loss result and is
          # worth reporting as itself rather than as N missing files.
          if ($upgraded.Count -eq 0) {
              throw "Nothing is installed under C:\ProgramData\BHoM after the upgrade, though the transaction exited 0 and RemoveExistingProducts ran. The upgrade removed the baseline and installed nothing."
          }

          $orphans = @(Compare-Object -ReferenceObject $reference -DifferenceObject $upgraded |
                       Where-Object { $_.SideIndicator -eq '=>' } | ForEach-Object { $_.InputObject })
          $missing = @(Compare-Object -ReferenceObject $reference -DifferenceObject $upgraded |
                       Where-Object { $_.SideIndicator -eq '<=' } | ForEach-Object { $_.InputObject })

          Write-Host "::notice::Clean-install tree: $($reference.Count) files. Upgraded tree: $($upgraded.Count) files. Orphans: $($orphans.Count). Missing: $($missing.Count)."

          $orphans | ForEach-Object { Write-Host "::error::Orphan left by the upgrade: $_" }
          $missing | ForEach-Object { Write-Host "::error::Missing after the upgrade: $_" }

          if ($orphans.Count -or $missing.Count) {
              throw "Upgraded tree differs from a clean install of the same MSI: $($orphans.Count) orphan(s), $($missing.Count) missing. Both are upgrade-path defects that a clean-install test cannot see."
          }

      - name: 'Assert file CONTENT was replaced, not just paths'
        # ASSERTION 5 of 9, and it exists because assertion 4 cannot see this class
        # of failure at all. That comparison matches PATH SETS, and a stale file
        # left behind by an overwrite that did not happen has exactly the same
        # path as the file that should have replaced it. Path-set equality would
        # report green on an upgrade that changed nothing.
        #
        # This reads the expected version out of the new MSI's own File table
        # rather than hardcoding it, so it needs no edit when versions move.
        #
        # NON-VACUITY IS ASSERTED FIRST, AND THAT ORDER IS DELIBERATE. If a probe
        # carries the same version in both packages, comparing the installed file
        # against the new version proves nothing: a stale baseline file would pass
        # it. So the step requires at least one probe whose version genuinely
        # differs between baseline and new, and fails loudly if none does, rather
        # than reporting a green that means nothing. A probe set that stops
        # discriminating because the versions converged is a broken test, and this
        # says so instead of hiding it.
        run: |
          . (Join-Path $env:RUNNER_TEMP 'bhom-upgrade-helpers.ps1')

          $probes = @('BHoM_Engine.dll', 'BHoM_Adapter.dll', 'BHoMUpgrades.dll')
          $newVersions  = Get-MsiFileVersions -MsiPath $env:NEW_MSI
          $baseVersions = Get-MsiFileVersions -MsiPath $env:BASELINE_MSI

          $checked = 0
          $discriminating = 0
          $failures = @()

          foreach ($probe in $probes) {
              # EVERY copy on disk is checked, not just a uniquely-resolving one.
              # An earlier version of this step skipped any probe that resolved to
              # more than one file, which quietly dropped 2 of 3 probes because two
              # of them ship in ASSEMBLIESDIR and GRASSHOPPERPLUGINDIR both. The
              # step still went green on the one survivor. Checking every copy is
              # both safer and stronger: it covers a second directory that
              # RemoveFolderEx also wipes.
              $expectedVersions = @($newVersions[$probe])
              $baselineVersions = @($baseVersions[$probe])

              if ($expectedVersions.Count -ne 1) {
                  Write-Host "::warning::Probe $probe declares $($expectedVersions.Count) distinct versions in the new MSI ($($expectedVersions -join ', ')), so there is no single expected value. Skipping it."
                  continue
              }
              $expected = $expectedVersions[0]
              if (-not $expected) {
                  Write-Host "::warning::Probe $probe carries no version in the new MSI, skipping it."
                  continue
              }

              $baseline = $null
              if ($baselineVersions.Count -eq 1) { $baseline = $baselineVersions[0] }

              $found = @(Get-ChildItem $BHoMRoot -Recurse -File -Filter $probe -ErrorAction SilentlyContinue)
              if ($found.Count -eq 0) {
                  Write-Host "::warning::Probe $probe is not present on disk after the upgrade, skipping it."
                  continue
              }

              $checked += $found.Count

              $discriminates = $baseline -and ($baseline -ne $expected)
              if ($discriminates) { $discriminating++ }

              # Written without the PowerShell 7 ternary deliberately, so this
              # script stays parseable by Windows PowerShell 5.1 and can be
              # syntax-checked outside a runner.
              $shownBaseline = '(absent)'
              if ($baseline) { $shownBaseline = $baseline }
              $marker = ''
              if (-not $discriminates) { $marker = '  [does NOT discriminate]' }

              foreach ($copy in $found) {
                  $actual = Get-OnDiskFileVersion -Path $copy.FullName
                  $where  = $copy.FullName.Substring($BHoMRoot.Length).TrimStart('\')

                  Write-Host ("::notice::{0}: baseline={1} new={2} onDisk={3}{4}" -f $where, $shownBaseline, $expected, $actual, $marker)

                  if ($actual -ne $expected) {
                      $failures += "$where is $actual on disk but the new MSI declares $expected"
                  }
                  elseif ($discriminates -and $actual -eq $baseline) {
                      $failures += "$where still carries the baseline version $baseline after the upgrade"
                  }
              }
          }

          if ($checked -eq 0) {
              throw "No probe file could be checked at all, so this assertion ran on nothing. Probes tried: $($probes -join ', ')."
          }

          if ($discriminating -eq 0) {
              throw "No probe has a different version in the baseline and the new package, so this assertion cannot distinguish a correct upgrade from a stale file. It would pass either way. Update the probe list in this step rather than accepting the green. Probes tried: $($probes -join ', ')."
          }

          if ($failures.Count -gt 0) {
              $failures | ForEach-Object { Write-Host "::error::$_" }
              throw "File content was not replaced by the upgrade: $($failures.Count) probe(s) wrong. The path set matched, so assertion 4 could not see this."
          }

          Write-Host "::notice::Content verified on $checked installed file(s) across $discriminating discriminating probe(s) of $($probes.Count) tried."

      - name: 'Assert repair after upgrade restores the same tree'
        # ASSERTION 6 of 9. Repair runs against the installed product's own
        # component bookkeeping, so this is where an inconsistency written by the
        # upgrade surfaces. One extra transaction, and it covers the repair half of
        # the upgrade-path risk this job exists for.
        run: |
          . (Join-Path $env:RUNNER_TEMP 'bhom-upgrade-helpers.ps1')
          $product = @(Get-BHoMProducts)[0]
          Assert-ProductCode -Value $product -Context 'repair assertion'
          Write-Host "Repairing $product"
          $rc = Invoke-Msi -Arguments @('/f', $product) -LogName 'd-repair.log'
          Write-Host "::notice::/f exit code: $rc"
          if ($rc -ne 0) { throw "Repair of $product after the upgrade failed with exit $rc" }

          $reference = @(Get-Content 'tree-a.txt')
          $repaired  = @(Get-BHoMTree)
          $delta = @(Compare-Object -ReferenceObject $reference -DifferenceObject $repaired)
          if ($delta.Count) {
              $delta | ForEach-Object { Write-Host "::error::Repair delta [$($_.SideIndicator)]: $($_.InputObject)" }
              throw "Repair after upgrade changed the installed tree in $($delta.Count) place(s). The upgraded install's component bookkeeping does not describe what is on disk."
          }
          Write-Host "::notice::Repair left the tree identical to a clean install."

      - name: 'Assert uninstall after upgrade leaves nothing behind'
        # ASSERTION 7 of 9. Reference-count leaks and orphaned directories surface
        # here and nowhere else: this is the only point in either workflow where a
        # product that arrived by upgrade is then removed.
        run: |
          . (Join-Path $env:RUNNER_TEMP 'bhom-upgrade-helpers.ps1')
          foreach ($code in @(Get-BHoMProducts)) {
              Write-Host "Removing $code"
              $rc = Invoke-Msi -Arguments @('/x', $code) -LogName 'e-final-uninstall.log'
              if ($rc -ne 0) { throw "Uninstall of upgraded product $code failed with exit $rc" }
          }

          $left = @(Get-BHoMProducts)
          if ($left.Count -ne 0) {
              $left | ForEach-Object { Write-Host "::error::Still registered: $_" }
              throw "Uninstall after upgrade left $($left.Count) product(s) registered."
          }

          $residue = @(Get-BHoMTree)
          if ($residue.Count -ne 0) {
              $residue | ForEach-Object { Write-Host "::error::Residual file after uninstalling an upgraded install: $_" }
              throw "Uninstall after upgrade left $($residue.Count) file(s) under C:\ProgramData\BHoM. Phase A proved a clean install uninstalls cleanly, so this is specific to the upgrade path."
          }
          Write-Host "::notice::Uninstall after upgrade left no products and no files."

      - name: 'Assert no fatal markers in any log'
        # ASSERTION 8 of 9. Same three patterns and the same reasoning as
        # install-test's equivalent step: bare 'returned actual error code 1603'
        # lines are non-fatal by design where a custom action is marked
        # Continue="yes", and the genuinely fatal cases produce 'Return value 3' or
        # 'MainEngineThread is returning 1603'.
        #
        # Runs across every transaction in the job, so a failure in a phase whose
        # exit code happened to be 0 is still caught.
        if: always()
        run: |
          $patterns = @(
              'Return value 3',
              'MainEngineThread is returning 1603',
              'SFXCA: Failed'
          )
          $logs = @(Get-ChildItem -Filter '*.utf8.log' -File)
          if ($logs.Count -eq 0) {
              Write-Host "::warning::No converted logs present, so this step asserted nothing. An earlier step must have failed before any msiexec transaction ran."
              exit 0
          }
          $failed = $false
          foreach ($log in $logs) {
              $hits = Select-String -Path $log.FullName -Pattern $patterns
              if ($hits) {
                  $failed = $true
                  $hits | ForEach-Object { Write-Host "::error::$($log.Name): $($_.Line.Trim())" }
              }
          }
          if ($failed) { throw "Fatal markers found in one or more upgrade-test logs" }
          Write-Host "::notice::No fatal markers across $($logs.Count) log(s)."

      # ASSERTION 9 of 9, in the sense that matters: the evidence survives the run.
      # Unconditional, because the logs are most valuable exactly when the job failed.
      - name: Upload upgrade-test logs and tree snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: upgrade-test-logs-${{ github.run_id }}
          # Every input is workspace-relative so the common ancestor stays the
          # workspace root and the artefact layout stays flat.
          path: |
            *.log
            *.utf8.log
            tree-a.txt
            tree-c.txt
          if-no-files-found: warn
          retention-days: 14

  # Publish the .msi as a preserved per-build GitHub Release. The flavour
  # is determined by what triggered the run, normalised in the resolve job:
  #
  #   schedule            alpha       prerelease=true   tag = vM.N.0-alpha.YYMMDD[.counter]
  #   dispatch alpha      alpha       prerelease=true   tag = vM.N.0-alpha.YYMMDD[.counter]
  #   dispatch alpha-beta alpha-beta  prerelease=true   tag = vM.N.0-alpha.beta.N
  #   dispatch beta       beta        prerelease=false  tag = vM.N.0-beta, marked Latest
  #
  # softprops/action-gh-release creates the git tag at the workflow's commit
  # if it does not already exist. For dispatched runs the tag is therefore
  # created by the workflow rather than pushed by a human.
  #
  # Each release is preserved (no rolling tag, no overwrite). History
  # accumulates indefinitely. Gated on the entire pipeline succeeding
  # (build + install-test). Failed builds do not appear on the Releases
  # page; the .msi is still accessible from the workflow run's
  # "Upload installer artefact" Actions artifact for local debugging.
  publish:
    name: Publish ${{ needs.resolve.outputs.release_type }} release
    needs: [resolve, build, install-test, admin-install-test, upgrade-test]
    # Skipped when should_publish=false (scheduled nightly + rule 3 soft trip:
    # v{M}.{N}.0 already shipped on this line). Build + install-test still ran
    # to preserve the smoke signal; the post-ship-bump-needed job below opens
    # a tracking issue.
    if: success() && needs.resolve.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read     # for the per-OS Test results table in the release body
    steps:
      - name: Checkout installer repo (for the release-notes scripts)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/find-previous-release.sh
            scripts/generate_release_notes.py
            scripts/compose-release-body.sh
          sparse-checkout-cone-mode: false

      - name: Download current .msi + dep-manifest.json
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: installer-${{ needs.resolve.outputs.release_type }}-${{ github.run_id }}
          path: artefact

      - name: Compute release tag and name
        id: tag
        shell: bash
        env:
          RESOLVED_TAG:  ${{ needs.resolve.outputs.release_tag }}
          RELEASE_TYPE:  ${{ needs.resolve.outputs.release_type }}
        run: |
          set -eu
          # The resolve job always emits release_tag for every supported event
          # (schedule / dispatch alpha / dispatch alpha-beta / dispatch beta), so we
          # reuse it directly. The release name varies by flavour.
          tag="$RESOLVED_TAG"
          case "$RELEASE_TYPE" in
              beta)       name="BHoM ${tag} Release" ;;
              alpha-beta) name="BHoM ${tag} Release Candidate" ;;
              alpha)      name="BHoM ${tag} Alpha" ;;
              *)          name="BHoM ${tag}" ;;
          esac
          echo "tag=$tag"   >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "::notice::Release tag = $tag"

      - name: Find canonical anchor
        id: anchor
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/find-previous-release.sh "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Download anchor's dep-manifest
        id: prev-manifest
        # Diff section renders for canonical installer-ref builds only:
        # canonical = installer_ref equals the repo's default branch (the same
        # branch alpha schedules run from and beta dispatches are constrained
        # to). Non-canonical dispatches (typically alpha-from-feature-branch)
        # skip the download; compose-release-body.sh renders a warning block
        # instead.
        if: |
          steps.anchor.outputs.anchor_kind == 'stable' &&
          needs.resolve.outputs.installer_ref == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          ANCHOR_TAG: ${{ steps.anchor.outputs.anchor_tag }}
        run: |
          set -eu
          mkdir -p prev
          if gh release download "$ANCHOR_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern dep-manifest.json \
              --dir prev 2>/dev/null; then
              echo "::notice::Anchoring against $ANCHOR_TAG"
              echo "path=prev/dep-manifest.json" >> "$GITHUB_OUTPUT"
          else
              echo "::warning::Could not download dep-manifest from $ANCHOR_TAG; rendering initial-baseline section."
              echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate dep-change release-notes section
        if: |
          steps.anchor.outputs.anchor_kind == 'stable' &&
          steps.prev-manifest.outputs.path != '' &&
          needs.resolve.outputs.installer_ref == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/generate_release_notes.py \
              artefact/dep-manifest.json \
              "${{ steps.prev-manifest.outputs.path }}" \
              release-notes-section.md \
              "${{ steps.anchor.outputs.anchor_tag }}"

      - name: Extract built_at from dep-manifest
        id: built-at
        run: |
          set -eu
          built_at=$(jq -r '.built_at' artefact/dep-manifest.json)
          [ -n "$built_at" ] && [ "$built_at" != "null" ] || { echo "::error::built_at missing from dep-manifest.json"; exit 1; }
          echo "value=$built_at" >> "$GITHUB_OUTPUT"

      - name: Compose full release body
        env:
          GH_TOKEN:                ${{ github.token }}
          INSTALLER_REF:           ${{ needs.resolve.outputs.installer_ref }}
          DEPENDENCY_BRANCH:       ${{ needs.resolve.outputs.dependency_branch }}
          RELEASE_TYPE:            ${{ needs.resolve.outputs.release_type }}
          IS_PRERELEASE:           ${{ needs.resolve.outputs.prerelease }}
          BUILT_AT:                ${{ steps.built-at.outputs.value }}
          CANONICAL_INSTALLER_REF: ${{ github.event.repository.default_branch }}
        run: bash scripts/compose-release-body.sh

      - name: Mint App token for Release publish
        # The default GITHUB_TOKEN works for creating a Release, but Releases
        # authored by GITHUB_TOKEN do NOT chain to downstream workflows
        # (GitHub's loop-protection: events from GITHUB_TOKEN cannot trigger
        # other workflow runs, with the exception of workflow_dispatch and
        # repository_dispatch). versioning-full-history.yml subscribes to
        # 'release: published' and must fire on every alpha-beta and beta
        # release, so the publish step authenticates as the BHoM CI App
        # instead. App-authored events DO chain.
        # See https://docs.github.com/actions/security-for-github-actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          app-id:      ${{ secrets.BHOM_APP_ID }}
          private-key: ${{ secrets.BHOM_APP_PRIVATE_KEY }}

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          # softprops/action-gh-release's 'token' input has a default of
          # ${{ github.token }}, which means env.GITHUB_TOKEN is never
          # consulted when the action runs. The App token must be passed
          # via the 'token' input to actually take effect. PR #48 set the
          # env override instead and the App identity silently did not
          # apply; validation on 2026-06-19 (run 27834810917) caught it.
          token:       ${{ steps.app-token.outputs.token }}
          tag_name:    ${{ steps.tag.outputs.tag }}
          name:        ${{ steps.tag.outputs.name }}
          body_path:   release-body.md
          files: |
            artefact/*.msi
            artefact/dep-manifest.json
            artefact/IncludedDLLs.txt
          make_latest: ${{ needs.resolve.outputs.make_latest }}
          prerelease:  ${{ needs.resolve.outputs.prerelease }}

  # There is deliberately no notify-on-failure job here. Removed by decision
  # ahead of the WiX tooling upgrade, which rebuilds this workflow.
  #
  # It is NOT removed because it worked. It did not: its `needs` omitted the
  # `resolve` job, so a resolve failure left `build` and `install-test` as
  # `skipped`, `failure()` never became true, and the nightly failed silently --
  # which is the case the job existed to catch. The fix was known and was never
  # applied here.
  #
  # Two consequences, recorded so neither is discovered by accident:
  #
  #   1. `scripts/notify-on-failure.sh` is deliberately KEPT. It is not dead.
  #      Its remaining consumer is a downstream installer workflow in a separate
  #      repository, which checks this repo out as a sibling and runs the script
  #      from there. Deleting it breaks that build, not this one.
  #
  #   2. That downstream job is correct and stays: it carries the `resolve`
  #      dependency and the explicit per-job result conditions this one lacked.
  #      The two builds now differ deliberately -- downstream reports an
  #      unattended failure, this one does not report at all.
  #
  # An unattended nightly with no failure reporting is a known, accepted gap for
  # the duration of the upgrade. Whatever replaces this workflow has to decide
  # again whether to report, and on what condition.
